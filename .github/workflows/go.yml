name: Go checks
on:
  push:
    paths: ["backend/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/go.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l backend)"
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
